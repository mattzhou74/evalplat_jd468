[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mattzhou74-evalplat_jd468"
version = "0.1.0"
description = "通过字符级与结构级特征识别模型评测平台工程师·函数调用的 schema 校验的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "mattzhou74" }]
keywords = ["ai", "llm", "cli", "analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://mattzhou74.github.io"
Repository = "https://github.com/mattzhou74/evalplat_jd468"
Issues = "https://github.com/mattzhou74/evalplat_jd468/issues"

[project.scripts]
evalplat_jd468 = "evalplat_jd468:main"

[tool.setuptools]
py-modules = ["evalplat_jd468"]
